
name: TERQA Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-tests:
    name: platform-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m pytest -v tests/unit

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: platform-tests
    if: ${{ always() }}

    steps:
      - name: Verify all platforms passed
        run: test "${{ needs.platform-tests.result }}" = "success"
